<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멋진하루의 홈페이지</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #f5f7fa;
      color: #222;
      line-height: 1.7;
    }
    header {
      background: #2d6cdf;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    header h1 { margin: 0; font-size: 2.2em; }
    header p { margin: 10px 0 0; opacity: 0.9; }
    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 16px;
    }
    section {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 { color: #2d6cdf; margin-top: 0; }
    footer {
      text-align: center;
      color: #888;
      padding: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <header>
    <h1>안녕하세요, 멋진하루입니다 👋</h1>
    <p>하나씩 배우면서 직접 만들어가는 중이에요</p>
  </header>

  <main>
    <section>
      <h2>자기소개</h2>
      <p>코딩은 처음이지만, 필요한 프로그램을 직접 만들어보는 걸 좋아해요.
         이 홈페이지도 첫 도전 중 하나예요!</p>
    </section>

    <section>
      <h2>진행 중인 프로젝트</h2>
      <ul>
        <li>재미있는 게임 놀이</li>
        <li>주식 자동매매 연습</li>
        <li>나만의 홈페이지 만들기 (지금 보고 계신 페이지!)</li>
      </ul>
    </section>

    <section>
      <h2>연락처</h2>
      <p>이메일: 안녕하세요</p>
    </section>
  </main>

  <footer>
    © 2026 멋진하루
  </footer>

</body>
</html>
